{% extends 'shared/base.html' %}
{% load static %}

{% block content %}

    <div class="chefs-full-list">

        <div class="page-header chef-header">
            <h1 class="page-title">Add Chef</h1>
        </div>


        <div class="form-card-container">
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}

                <div class="chef-actions" style="justify-content: flex-end; margin-top: 2rem;">
                    <button class="btn btn-add-main" type="submit">
                        {% if form.instance.pk %}Save Changes{% else %}Add Chef{% endif %}
                    </button>
                    <a class="btn btn-toggle-comments" href="javascript:history.back()">Cancel</a>
                </div>
            </form>
        </div>
    </div>

{% endblock %}
