{% extends 'shared/base.html' %}
{% load static %}

{% block content %}
<div class="main-content">
    <div class="page-header">
        <h1 class="page-title">Delete Recipe</h1>
    </div>

    <div class="recipes-full-list">
        <div class="form-card-container">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}


                <p class="form-warning-text">
                    Are you sure you want to delete this recipe?
                </p>

                <div class="recipe-actions" style="justify-content: flex-start; margin-top: 1.5rem;">
                    <button class="btn btn-delete" type="submit">Delete</button>
                    <a class="btn btn-toggle-comments" href="{% url 'recipes:details' %}">Go back</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
