{% extends 'shared/base.html' %}
{% load static %}

{% block content %}
<div class="main-content">
    <div class="page-header">
        <h1 class="page-title">Update Recipe</h1>
    </div>

    <div class="recipes-full-list">
        <div class="form-card-container">
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="recipe-actions" style="justify-content: flex-end; margin-top: 2rem;">
                    <button class="btn btn-update" type="submit">Update Recipe</button>
                    <a class="btn btn-toggle-comments" href="{% url 'recipes:details-single' recipe.slug %}">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
